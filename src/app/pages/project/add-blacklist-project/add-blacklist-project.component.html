<div class="container">
  <div class="header">
    <div class="left">
      <h1 class="title">Add Blacklist Project</h1>
      <div class="line"></div>
      <div class="bread">
        <app-breadcrumb [navArray]="navArray"></app-breadcrumb>
      </div>
    </div>
  </div> <!-- END! Header -->


  <div class="content">
    <form #formElement="ngForm" [formGroup]="dataForm" (ngSubmit)="onSubmit()" autocomplete="off">

      <div class="d-row">
        <mat-form-field appearance="outline">
          <mat-label>Website</mat-label>
          <input [readonly]="id" formControlName="domain" matInput placeholder="Enter Website" required>
          <mat-error>This field is required</mat-error>
        </mat-form-field>
      </div>


      <div class="action">
        <button (click)="onDiscard()" mat-stroked-button color="warn" type="button" class="discard">
          <mat-icon>arrow_back_ios</mat-icon>
          Discard
        </button>

        @if (!isLoading) {
          <!--        <button [disabled]="checkRole==='editor'"  mat-raised-button color="accent" type="submit">-->
          <button mat-raised-button color="accent" type="submit">
            <mat-icon>check</mat-icon>
            {{ id ? 'Update Project' : 'Add Project' }}
          </button>
        } @else {
          <button class="btn-loader" mat-raised-button type="button" color="accent">
            <div><span class="loader"></span></div>
            <div><span class="txt">{{ id ? 'Update Blacklist' : 'Add Blacklist' }}</span></div>
          </button>
        }
      </div>

    </form> <!-- END! Form -->

  </div> <!-- END! Content -->
</div>
